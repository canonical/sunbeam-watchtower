collaborators:
  launchpad_team: sunbeam
  email_overrides: ./email-overrides.yaml
launchpad:
  default_owner: sunbeam
  use_keyring: true
  series:
    - "2024.1"
    - "2025.1"
    - "2026.1"
  development_focus: "2026.1"
github:
  use_keyring: false
  client_id: Ov23lin1xbKE8bXlFFHq
gerrit:
  hosts:
    - url: https://review.opendev.org

bug_groups:
  sunbeam:
    common_project: snap-openstack

releases:
  default_target_profile: noble-and-newer
  target_profiles:
    noble-and-newer:
      include:
        - base_names: [ubuntu]
          min_base_channel: "24.04"

tui:
  default_pane: packages
  panes:
    packages:
      mode: excuses
      filters:
        tracker: ubuntu
        team: ubuntu-openstack

projects:
  - name: sunbeam-charms
    artifact_type: charm
    code:
      forge: gerrit
      host: https://review.opendev.org
      project: openstack/sunbeam-charms
    build:
      owner: canonical
      official_codehosting: true
      lp_project: sunbeam-charms
      # prepare_command runs inside an isolated temporary checkout of the
      # target commit before the source is pushed to Launchpad. Files
      # produced by this command are pushed in full — including files
      # that .gitignore would normally exclude (e.g. build/, dist/,
      # generated tarballs). The live worktree is not modified.
      #
      # Security scope: isolation prevents accidental inclusion of
      # pre-existing ignored files from the live tree (.env, IDE caches,
      # credentials). It does NOT sandbox the command — it runs as your
      # user with normal filesystem and environment access.
      prepare_command: |-
        rev="$(git rev-parse --short HEAD)"

        echo "Setting charms versions to $rev"
        for charmcraft_yaml in $(find . -name "charmcraft.yaml"); do
            dir_name="$(dirname "$charmcraft_yaml")"
            echo "$rev" > "$dir_name/version"
        done

        echo "Running prepare script"
        python3 ./repository.py prepare --clean
      channels:
        charmcraft: latest/stable
      skip_artifacts:
        - sunbeam-libs
    bugs:
      - forge: launchpad
        project: snap-openstack
        group: sunbeam
      - forge: launchpad
        project: sunbeam-charms
        group: sunbeam
    release:
      target_profile: noble-and-newer
      skip_artifacts:
        - sunbeam-libs

  - name: openstack
    artifact_type: snap
    code:
      forge: github
      owner: canonical
      project: snap-openstack
    build:
      owner: canonical
      official_codehosting: true
      lp_project: snap-openstack
    bugs:
      - forge: launchpad
        project: snap-openstack
        group: sunbeam
    release:
      branches:
        - series: "2024.1"
          branch: split
          risks: [edge]

  - name: openstack-hypervisor
    artifact_type: snap
    code:
      forge: github
      owner: canonical
      project: snap-openstack-hypervisor
    bugs:
      - forge: launchpad
        project: snap-openstack
        group: sunbeam
      - forge: launchpad
        project: snap-openstack-hypervisor
        group: sunbeam

  - name: ubuntu-openstack-rocks
