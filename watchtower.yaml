    code:
      forge: github
      owner: canonical
      project: ubuntu-openstack-rocks
    build:
      owner: canonical
      official_codehosting: true
      lp_project: ubuntu-openstack-rocks
    bugs:
      - forge: launchpad
        project: snap-openstack
        group: sunbeam
      - forge: launchpad
        project: ubuntu-openstack-rocks
        group: sunbeam

  - name: snap-cinder-volume
